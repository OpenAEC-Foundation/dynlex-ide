name: Verify DynLex IDE
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python3 scripts/build.py --test
      - run: python3 scripts/build.py
